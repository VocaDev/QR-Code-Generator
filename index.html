<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gjenerues për QR kod</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Gjenero QR kodin tënd</h1>
        <input id="qrText" placeholder="Vendos text ose URL">
        <button id="generateBtn">Gjenero</button>
        <div id="qrCode"></div>
        <button id="downloadBtn" style="display: none;">Shkarko QR</button>
    </div>
  <!-- 1. QRCode library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <!-- 2. Your JS code -->
  <script src="script.js"></script>
</body>
</html>
